services:
  tailscale:
    image: tailscale/tailscale:v1.102.2
    container_name: calenso-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-calenso-n8n}
    ports:
      - "5679:5678"
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.27.4
    container_name: calenso-n8n
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - N8N_HOST=${N8N_HOST:-calenso-n8n.tail713d2f.ts.net}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://calenso-n8n.tail713d2f.ts.net/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-https://calenso-n8n.tail713d2f.ts.net/}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
  tailscale_state:
